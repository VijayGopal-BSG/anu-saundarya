    if (st.done.length - st.reviewAt >= 5) return { kind: 'review', units: st.done.slice(st.reviewAt, st.reviewAt + 5) };
    const u = C.units.find(x => x.verses.length && !passed(x.id));
    if (u) return { kind: 'learn', unit: u.id };
    return { kind: 'free' };
  }
  function stepTitle(n) {
    if (n.kind === 'review') return 'Review: chant your last 5 parts, one after another';
    if (n.kind === 'learn') return 'Learn ' + unitById[n.unit].title;
    return 'You have learned the whole Saundarya Lahari. Practise any part you like.';
  }

  // ---------------- one player, one recorder ----------------
  let onPlayer = () => {};
  const player = new S.AmmaPlayer((k, a, b) => onPlayer(k, a, b));
  const rec = new S.Recorder();
  let recording = false, takeToken = 0, wake = null;
  function leave() { takeToken++; if (recording) { recording = false; rec.stop(); } try { wake && wake.release(); } catch (e) {} wake = null; player.stop(); onPlayer = () => {}; window.scrollTo(0, 0); }

  function listenBox(unitId) {
    const sp = st.settings.speed;
    return `<div class="card"><div class="spread"><b>Listen to Amma</b><span class="small muted" id="ptime">0:00</span></div>
      <div class="bar" style="margin:8px 0"><i id="pbar" style="width:0"></i></div>
      <div class="row"><button class="primary" id="play" style="flex:1">▶ Play</button><button id="restart">⟲ From the start</button></div>
      <div class="row" style="margin-top:8px"><span class="small muted">Speed</span>${[1, 0.85, 0.7].map(x => `<button class="chip ${x === sp ? 'on' : ''}" data-speed="${x}">${x === 1 ? 'Normal' : x === 0.85 ? 'A little slower' : 'Slow'}</button>`).join('')}</div>
      <p class="small muted" id="pmsg"></p></div>`;
  }
  function bindListen(unitId) {
    const play = $('#play');
    onPlayer = (k, a, b) => {
      if (k === 'time') { const pb = $('#pbar'), pt = $('#ptime'); if (pb && b) pb.style.width = (100 * a / b).toFixed(1) + '%'; if (pt) pt.textContent = fmt(a) + (b ? ' / ' + fmt(b) : ''); }
      if (k === 'playing') { if (play) play.textContent = '❚❚ Pause'; const m = $('#pmsg'); if (m) m.textContent = ''; }
      if (k === 'pause' || k === 'ended') { if (play) play.textContent = '▶ Play'; }
      if (k === 'ended') { const s = U(unitId); s.listens++; save(); }
      if (k === 'waiting') { const m = $('#pmsg'); if (m) m.textContent = 'Loading…'; }
      if (k === 'error') { const m = $('#pmsg'); if (m) m.innerHTML = '<span class="bad">Amma\'s recording did not play (' + esc(a) + '). Check the internet connection and the silent switch, then tap Play again.</span>'; if (play) play.textContent = '▶ Play'; }
    };
    play.disabled = true; $('#restart').disabled = true; $('#pmsg').textContent = 'Loading Amma\'s recording…';
    player.prepare(unitId).then(() => { if (!document.body.contains(play)) return; play.disabled = false; $('#restart').disabled = false; $('#pmsg').textContent = ''; loadRef(unitId).catch(() => {}); })
      .catch(e => { const m = $('#pmsg'); if (m) m.innerHTML = '<span class="bad">' + esc(e.message || String(e)) + '</span>'; });
    play.onclick = () => { if (recording) return; if (player.playing && player.unit === unitId) player.pause(); else player.play(unitId, st.settings.speed, false); };
    $('#restart').onclick = () => { if (recording) return; player.play(unitId, st.settings.speed, true); };
    app.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { st.settings.speed = +b.dataset.speed; save(); player.setRate(st.settings.speed); app.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', +x.dataset.speed === st.settings.speed)); });
  }

  // ---------------- text ----------------
  function textBlock(u) {
    if (!u.verses.length) return `<div class="card"><p>The opening meditation (<i>dhyānam</i>) that Amma chants before the hymn. It is not in the printed text of the hymn, so there is no text here: listen, and chant along with her.</p></div>`;
    return u.verses.map(v => {
      const V = C.verses[v], L = u.lines.filter(l => l.verse === v);
      return `<div class="card"><div class="spread"><span class="label">Verse ${v}</span><span class="small muted">${esc(V.title)}</span></div>
        ${L.map(l => `<div class="deva sm" style="margin-top:4px">${esc(l.deva)}</div>${st.settings.iast ? `<div class="iast">${esc(l.iast)}</div>` : ''}`).join('')}
        <details style="margin-top:8px"><summary><span class="chev">›</span> <b>Meaning</b></summary><p>${md(V.meaning)}</p>${V.note ? `<p class="small muted"><b>Text note.</b> ${md(V.note)}</p>` : ''}</details>
        <details><summary><span class="chev">›</span> <b>Commentary</b></summary>${V.commentary.split('\n\n').map(p => '<p class="small">' + md(p) + '</p>').join('')}</details></div>`;
    }).join('');
  }
  const md = t => esc(t).replace(/\*([^*]+)\*/g, '<i>$1</i>');

  // ---------------- recording a take ----------------
  function recorderUI(container, unitId, onResult) {
    container.innerHTML = `<button class="rec big" id="recbtn">● Record yourself</button>
      <div id="recpanel" class="hidden"><div class="spread"><span><b class="bad">● Recording</b> <span class="muted small" id="rectime">0:00</span></span><span class="muted small">Tap Done when you finish</span></div>
      <div class="meter" style="margin:8px 0"><i id="lvl"></i></div><p class="small muted">Chant all of it, as Amma does. Breathe at the end of a line.</p><button class="primary big" id="donebtn">■ Done</button></div>
      <p id="recmsg" class="small"></p>`;
    const btn = container.querySelector('#recbtn'), panel = container.querySelector('#recpanel'), msg = container.querySelector('#recmsg');
    btn.onclick = async () => {
      if (recording || btn.disabled) return;
      btn.disabled = true;
      const my = ++takeToken;
      player.stop();
      msg.textContent = '';
      let ref;
      try { ref = await loadRef(unitId); } catch (e) { btn.disabled = false; msg.innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; return; }
      let finishing = false, timer = null;
      async function finish() {
        if (finishing || my !== takeToken) return; finishing = true;
        clearInterval(timer);
        recording = false;
        const frames = await rec.stop();
        try { wake && wake.release(); } catch (e) {} wake = null;
        if (my !== takeToken) return;
        panel.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false;
        msg.textContent = 'Comparing with Amma… (a few seconds)';
        setTimeout(() => {
          if (my !== takeToken) return;
          let res;
          try { res = TE.score(frames, ref, unitById[unitId], { target: target(), tuneHi: st.settings.tuneHi }); }
          catch (e) { res = { ok: false, reason: 'error', error: String(e) }; }
          res.sampleRate = rec.sampleRate;
          msg.textContent = '';
          onResult(res, ref);
        }, 40);
      }
      try {
        recording = true;
        await rec.start((f, i, peak) => { if (my !== takeToken) return; if (i % 4 === 0) { const el = $('#lvl'); if (el) el.style.width = Math.min(100, Math.round(peak * 220)) + '%'; } });
      } catch (e) {
        recording = false; btn.disabled = false;
        rec.stop(); // release the microphone if getUserMedia succeeded before the failure
        msg.innerHTML = '<span class="bad">' + esc(e.name === 'NotAllowedError' ? 'Microphone permission was refused. In Settings → Safari → Microphone, allow this site, then reload.' : (e.message || String(e))) + '</span>';
        return;
      }
      if (my !== takeToken) { rec.stop(); return; }
      try { if (navigator.wakeLock) { const w = await navigator.wakeLock.request('screen'); if (my === takeToken) wake = w; else w.release(); } } catch (e) {}
      btn.classList.add('hidden'); panel.classList.remove('hidden');
      const t0 = Date.now(), maxS = Math.max(240, Math.round(ref.dur * 3));
      timer = setInterval(() => { if (my !== takeToken) { clearInterval(timer); return; } const s = (Date.now() - t0) / 1000; const el = $('#rectime'); if (el) el.textContent = fmt(s); if (s > maxS) finish(); }, 500);
      container.querySelector('#donebtn').onclick = finish;
    };
  }
  const WHY = { short: 'The take was too short to compare. Chant the whole part, then tap Done.', noisy: 'There was too much background noise. Find a quieter room and hold the phone about a forearm away.', unvoiced: 'I could hardly hear your voice. Chant a little louder, closer to the phone.', align: 'I could not match your take with Amma\'s. Listen once more and chant along the same tune.', error: 'Something went wrong while scoring. Try once more; if it repeats, tell Vijay.' };
  function resultHTML(res, ref, u) {
    if (!res.ok) return `<div class="note">${esc(WHY[res.reason] || WHY.error)}</div>`;
    const pass = res.score >= target();
    const bar = (name, v) => `<div class="spread small" style="margin-top:6px"><span>${name}</span><span class="muted">${v}</span></div><div class="bar"><i style="width:${v}%;background:${v >= 70 ? 'var(--ok)' : v >= 45 ? 'var(--warn)' : 'var(--bad)'}"></i></div>`;
    return `<div class="${pass ? 'good' : 'badbox'}" style="margin:8px 0"><div class="spread"><b>${pass ? '✓ Well done' : 'Not yet'}</b><span class="small muted">score ${res.score} · pass mark ${target()}</span></div>
      <ul style="margin:6px 0 0 18px;padding:0">${res.comments.map(c => '<li>' + esc(c) + '</li>').join('')}</ul></div>
      <div class="card">${bar('Tune — following Amma\'s rise and fall', res.parts.tune)}${bar('Length and pace — all of it, at about her speed', res.parts.pace)}${bar('Flow — breathing at line ends', res.parts.pauses)}${bar('Rhythm — keeping an even pace, as she does', res.parts.rhythm)}
      <div style="margin-top:10px">${S.tuneGraph(ref, res, u)}</div><p class="small muted">Grey: Amma's tune, from start to end. Your voice, matched to hers: green close, red apart (your key does not matter). Swipe sideways on a long part.</p>
      ${st.settings.teacher ? `<p class="small muted">dev ${res.meanDev.toFixed(2)} st · ratio ${res.ratio.toFixed(2)} · cover ${(res.cover * 100).toFixed(0)}% · syllables ${res.nucRatio.toFixed(2)} · pace ${res.pace.toFixed(2)} · rhythm sd ${res.sd.toFixed(2)} · pauses ${res.pz}/${res.pzAllowed} · pauses pts ${res.parts.pauses} · ${res.sampleRate} Hz</p>` : ''}</div>`;
  }
  const dots = a => '<span class="dots">' + a.slice(-3).map(s => `<i class="${s >= target() ? 'p' : 'f'}"></i>`).join('') + '</span>';

  // ---------------- views ----------------
  function home() {
    leave();
    const n = nextStep(), nPassed = C.units.filter(u => u.verses.length && passed(u.id)).length, nAll = C.units.filter(u => u.verses.length).length;
    app.innerHTML = `<h1>Saundarya Lahari with Amma</h1><p class="muted">Listen to Amma, chant, and see how close you are.</p>
      <div class="card"><div class="spread"><b>${nPassed} of ${nAll} parts learned</b><span class="small muted">pass mark ${target()}</span></div><div class="bar" style="margin-top:8px"><i style="width:${(100 * nPassed / nAll).toFixed(1)}%"></i></div></div>
      <div class="card"><p class="small muted" style="margin:0 0 6px">Next</p><h2 style="margin:0 0 10px">${esc(stepTitle(n))}</h2><button class="primary big" id="go">Start</button></div>
      ${storageOK ? '' : '<p class="note">This browser is not saving progress (private browsing?). Open the app from its home-screen icon.</p>'}
      <details class="card"><summary><span class="chev">›</span> <b>All parts</b></summary><ul class="clean">${C.units.map(u => { const s = st.units[u.id]; return `<li class="spread"><button class="link" data-u="${u.id}">${esc(u.title)}</button><span>${s && s.ear ? '<span class="small muted">by ear</span>' : s && s.passed ? '<span class="tick">✓</span>' : s ? dots(s.a) : ''}</span></li>`; }).join('')}</ul></details>
      <div class="row"><button id="backup">Save my progress</button><button id="settings">Settings</button><button id="help">Help</button></div>
      <p class="small muted" style="margin-top:14px">Amma's recordings, 2019. Text: sanskritdocuments.org. Your voice is analysed on this phone and never uploaded.</p>`;
    $('#go').onclick = () => { if (n.kind === 'review') review(n.units, 0, []); else if (n.kind === 'learn') learn(n.unit); else learn(C.units[0].id); };
    app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => learn(b.dataset.u));
    $('#backup').onclick = backup; $('#settings').onclick = settings; $('#help').onclick = help;
  }

  function learn(uid) {
    leave();
    const u = unitById[uid], s = U(uid);
    app.innerHTML = `<div class="spread"><button class="link" id="back">‹ Home</button><span class="small muted">Part ${u.idx + 1} of ${C.units.length}</span></div>
      <h1>${esc(u.title)}</h1><p class="small muted">Listen to Amma at least twice${u.verses.length ? ', following the text' : ''}. Then record yourself chanting the whole of it.</p>
      ${listenBox(uid)}${textBlock(u)}
      ${u.verses.length ? '' : '<p class="small muted">The dhyānam is for listening and chanting along; it is not scored. Start the hymn from the home page.</p>'}
      <div class="card ${u.verses.length ? '' : 'hidden'}"><div class="spread"><b>Your turn</b><span>${dots(s.a)}</span></div><p class="small muted">Pass on 2 of your last 3 tries.</p><div id="recbox"></div><div id="res"></div></div>
      <div class="row" id="after"></div>`;
    $('#back').onclick = home;
    bindListen(uid);
    const after = () => {
      const s2 = U(uid), ok = s2.passed || s2.ear;
      $('#after').innerHTML = ok ? `<button class="primary big" id="next">Next ›</button>` : (st.settings.teacher ? `<button id="ear">Mark as learnt by ear</button>` : '');
      const nx = $('#next'); if (nx) nx.onclick = () => { const n = nextStep(); if (n.kind === 'review') review(n.units, 0, []); else if (n.kind === 'learn') learn(n.unit); else home(); };
      const ear = $('#ear'); if (ear) ear.onclick = () => { s2.ear = true; if (!st.done.includes(uid)) st.done.push(uid); save(); after(); };
    };
    recorderUI($('#recbox'), uid, (res, ref) => {
      $('#res').innerHTML = resultHTML(res, ref, u);
      if (res.ok) {
        const s2 = U(uid); s2.a.push(res.score); s2.a = s2.a.slice(-20);
        const last3 = s2.a.slice(-3);
        if (!s2.passed && last3.filter(x => x >= target()).length >= 2) { s2.passed = true; if (!st.done.includes(uid)) st.done.push(uid); $('#res').insertAdjacentHTML('afterbegin', '<p class="good"><b>Learned!</b> Two good tries out of three. On to the next part.</p>'); }
        save();
        const d = app.querySelector('.card .dots'); if (d) d.outerHTML = dots(s2.a);
      }
      after();
    });
    after();
  }

  // review: the last 5 learned parts, each recorded on its own
  function review(list, k, scores) {
    leave();
    if (k >= list.length) {
      const ok = scores.every(x => x !== null && x >= target() - 5);
      if (ok) { st.reviewAt += list.length; st.reviews.push({ at: Date.now(), units: list, scores }); save(); }
      app.innerHTML = `<h1>Review done</h1><div class="${ok ? 'good' : 'badbox'}"><p><b>${ok ? 'All five held up — well done.' : 'Some parts need another look.'}</b></p><ul>${list.map((id, i) => `<li>${esc(unitById[id].title)}: ${scores[i] === null ? 'not scored' : scores[i]}</li>`).join('')}</ul></div>
        <button class="primary big" id="go">${ok ? 'Continue' : 'Try the review again'}</button><p><button class="link" id="home">Home</button></p>`;
      $('#go').onclick = () => ok ? home() : review(list, 0, []);
      if (!ok) $('#go').insertAdjacentHTML('afterend', '<button class="big" id="skiprev" style="margin-top:8px">Carry on to new parts (review these later)</button>');
      const sk = $('#skiprev'); if (sk) sk.onclick = () => { st.reviewAt += list.length; st.reviews.push({ at: Date.now(), units: list, scores, skipped: true }); save(); home(); };
      $('#home').onclick = home;
      return;
    }
    const uid = list[k], u = unitById[uid];
    app.innerHTML = `<div class="spread"><button class="link" id="back">‹ Home</button><span class="small muted">Review ${k + 1} of ${list.length}</span></div>
      <h1>${esc(u.title)}</h1><p class="small muted">Chant it from memory if you can (the text is below if you need it). You may listen to Amma first.</p>
      <div class="card"><div id="recbox"></div><div id="res"></div></div><div class="row" id="after"></div>${listenBox(uid)}
      <details class="card"><summary><span class="chev">›</span> <b>Show the text</b></summary>${u.lines.map(l => `<div class="deva sm">${esc(l.deva)}</div>`).join('') || '<p class="small">Dhyānam (no text).</p>'}</details>`;
    $('#back').onclick = home;
    bindListen(uid);
    recorderUI($('#recbox'), uid, (res, ref) => {
      $('#res').innerHTML = resultHTML(res, ref, u);
      $('#after').innerHTML = `<button class="primary big" id="next">${k + 1 < list.length ? 'Next part ›' : 'Finish'}</button>`;
      $('#next').onclick = () => review(list, k + 1, scores.concat([res.ok ? res.score : null]));
    });
  }

  // ---------------- backup / settings / help ----------------
  function progressCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(st)))); }
  function summaryText() {
    const nP = C.units.filter(u => passed(u.id)).length;
    const recent = C.units.filter(u => st.units[u.id] && st.units[u.id].a.length).slice(-5).map(u => `${u.title}: ${st.units[u.id].a.slice(-3).join(', ')}`).join('; ');
    return `Saundarya Lahari with Amma — ${nP} of ${C.units.length} parts learned. Recent: ${recent || 'none'}. Pass mark ${target()}.`;
  }
  function backup() {
    leave();
    app.innerHTML = `<button class="link" id="back">‹ Home</button><h1>Save my progress</h1>
      <p class="small">Progress is kept on this phone. To be safe, share this code with Vijay now and then; it can bring your progress back on another phone.</p>
      <textarea id="code" readonly>${esc(progressCode())}</textarea>
      <div class="row"><button class="primary" id="share">Share…</button><button id="copy">Copy</button></div>
      <h2>Bring progress back</h2><textarea id="imp" placeholder="Paste a progress code here"></textarea><button id="load">Load this code</button><p id="msg" class="small"></p>`;
    $('#back').onclick = home;
    $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(progressCode()); $('#msg').textContent = 'Copied.'; } catch (e) { $('#code').select(); } };
    $('#share').onclick = async () => { const text = summaryText() + '\n\n' + progressCode(); try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); $('#msg').textContent = 'Copied — paste it into a message to Vijay.'; } st.lastExport = Date.now(); save(); } catch (e) {} };
    $('#load').onclick = () => { if (!confirm('Replace the progress on this phone with this code?')) return; try { const o = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!o || !o.units) throw 0; st = Object.assign(fresh(), o); normalise(); save(); $('#msg').textContent = 'Progress loaded.'; } catch (e) { $('#msg').innerHTML = '<span class="bad">That is not a progress code from this app.</span>'; } };
  }
  function settings() {
    leave();
    const s = st.settings;
    app.innerHTML = `<button class="link" id="back">‹ Home</button><h1>Settings</h1>
      <div class="card"><label class="spread"><span>Show English transliteration under the Devanagari</span><input type="checkbox" id="iast" ${s.iast ? 'checked' : ''}></label></div>
      <div class="card"><label class="spread"><span>Pass mark</span><input type="number" id="target" min="50" max="95" value="${s.target}" style="width:90px"></label></div>
      ${s.teacher ? `<div class="card"><label class="spread"><span>Tune strictness</span><select id="tuneHi">${[[0.6, 'Strict'], [0.75, 'Medium'], [0.9, 'Gentle']].map(([v, n]) => `<option value="${v}" ${+s.tuneHi === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label><p class="small muted">How closely the tune must follow Amma's. Set by Vijay after testing.</p></div>` : ''}
      <div class="card"><label class="spread"><span>Teacher mode (numbers, "learnt by ear")</span><input type="checkbox" id="teacher" ${s.teacher ? 'checked' : ''}></label></div>
      <p><a class="btn" href="mic.html">Device check</a></p>`;
    $('#back').onclick = home;
    $('#iast').onchange = e => { s.iast = e.target.checked; save(); };
    $('#target').onchange = e => { const v = Math.max(50, Math.min(95, +e.target.value || 75)); s.target = v; save(); };
    $('#teacher').onchange = e => { s.teacher = e.target.checked; save(); settings(); };
    const th = $('#tuneHi'); if (th) th.onchange = e => { s.tuneHi = +e.target.value; save(); };
  }
  function help() {
    leave();
    app.innerHTML = `<button class="link" id="back">‹ Home</button><h1>How it works</h1>
      <div class="card small"><p>The hymn is in ${C.units.length} parts, exactly as Amma recorded it: her opening meditation, then one to three verses each.</p>
      <p><b>Each part:</b> listen to Amma (slower if you like) while following the text, then tap <b>Record yourself</b>, chant the whole part, and tap <b>Done</b>. You pass a part with two good tries out of three.</p>
      <p><b>The score</b> compares your chant with Amma's: whether your voice rises and falls where hers does (your own key is fine), whether you chanted all of it at about her pace, where you breathe, and how evenly you keep the pace. It does not check pronunciation word by word, or long and short syllables — for that and for meanings, ask your Guru.</p>
      <p><b>Every 5 parts</b> there is a short review of those five.</p>
      <p><b>Tips:</b> a quiet room; the phone about a forearm away; no AirPods or Bluetooth headphones (they change the microphone); turn the volume up if you can't hear Amma.</p>
      <p>Always open the app from its home-screen icon, so your progress stays in one place.</p></div>`;
    $('#back').onclick = home;
  }

  window.addEventListener('pagehide', () => { if (recording) rec.stop(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && recording) { const d = document.querySelector('#donebtn'); if (d) d.click(); } });
  home();
};

</script><script>
/* Boot: unlock the vault (passphrase once per browser), load the encrypted course, start the app. */
(async function () {
  'use strict';
  const S = window.Shared, app = document.querySelector('#app');
  async function go() { window.COURSE = await S.Vault.json('c.bin'); window.startApp(); }
  function gate(msg) {
    app.innerHTML = `<h1>Saundarya Lahari with Amma</h1><div class="card"><p>This is private. Enter the passphrase Vijay gave you.</p>
      <input id="pass" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" style="width:100%;font:18px var(--ui);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)" placeholder="passphrase">
      <button class="primary big" id="unlock" style="margin-top:10px">Open</button><p class="small" id="pm">${msg || ''}</p>
      <p class="small muted">Open the app from its home-screen icon, so it remembers the passphrase and your progress.</p></div>`;
    document.querySelector('#unlock').onclick = async () => {
      const pm = document.querySelector('#pm'); pm.textContent = 'Checking…';
      if (!window.crypto || !crypto.subtle) { pm.innerHTML = '<span class="bad">This browser cannot open it. Use Safari on the iPhone or Chrome on the Mac.</span>'; return; }
      try { await S.Vault.unlock(document.querySelector('#pass').value); }
      catch (e) { pm.innerHTML = '<span class="bad">That passphrase did not open it. Check it with Vijay (spaces and dashes count).</span>'; return; }
      try { await go(); } catch (e) { pm.innerHTML = '<span class="bad">' + S.esc(e.message || String(e)) + '</span>'; }
    };
  }
  if (await S.Vault.load()) { try { await go(); } catch (e) { gate(S.esc(e.message || String(e))); } }
