</style></head><body><main class="wrap"><p><a class="btn" href="index.html">‹ Back to the app</a></p><h1>Device check</h1>
<p class="muted">Open in <b>Safari</b> on the iPhone (Chrome on the Mac). Do the checks, then copy the report to Vijay.</p>
<div class="card hidden" id="lock"><p>Enter the passphrase first.</p><input id="pass" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" style="width:100%;font:16px var(--ui);padding:10px"><button class="primary" id="unlock" style="margin-top:8px">Open</button><p class="small" id="pm"></p></div>
<div class="card"><h3>1. Amma's recording</h3><p><button id="pt">▶ Play 6 seconds</button></p><p class="small" id="pres"></p></div>
<div class="card"><h3>2. Microphone</h3><p class="small muted">Allow the microphone when asked. No AirPods or Bluetooth.</p><p><button class="rec" id="mt">● Record 6 seconds</button></p><p class="small" id="mres"></p></div>

<div class="card"><h3>Report</h3><textarea id="report" readonly></textarea><div class="row"><button class="primary" id="copy">Copy report</button><button id="share">Share…</button></div></div></main><script>window.VAULT={"salt": "YfNA64a+wvxe33rt5HXEVA==", "iter": 250000, "check": "pILDMY7zP0X8VxZxLInXSjcKM0sgr/ABwkt8N60jEPVInc4="};</script><script>
/* Chant Trainer scoring engine (no reference audio).
 * Pitch tracking (YIN) -> syllable segmentation (DP to the expected syllable count)
 * -> per-syllable level (low / middle / high, unsupervised) -> compare with the svara marks.
 * Works in the browser (window.ChantEngine) and in Node (module.exports). */
(function (root) {
  'use strict';
  const SR = 16000, HOP = 160, WIN = 400, TAU_MIN = 27, TAU_MAX = 267; // 60–600 Hz
  const FRAME_S = HOP / SR;

  // ---------- resampling to 16 kHz ----------
  function makeResampler(inRate) {
    // simple anti-alias (moving average over ratio) + linear interpolation; state kept across chunks
    const ratio = inRate / SR;
    let pos = 0, prev = 0, acc = [], carry = new Float32Array(0);
    const k = Math.max(1, Math.round(ratio));
    return function (chunk) {
      // box filter of width k
      const buf = new Float32Array(carry.length + chunk.length);
      buf.set(carry); buf.set(chunk, carry.length);
      const filt = new Float32Array(buf.length);
      let s = 0;
      for (let i = 0; i < buf.length; i++) { s += buf[i]; if (i >= k) s -= buf[i - k]; filt[i] = s / Math.min(k, i + 1); }
      const out = [];
      while (pos + 1 < filt.length) {
        const i0 = Math.floor(pos), f = pos - i0;
        out.push(filt[i0] * (1 - f) + filt[i0 + 1] * f);
        pos += ratio;
      }
      const keepFrom = Math.max(0, Math.floor(pos) - k);
      carry = buf.slice(keepFrom);
      pos -= keepFrom;
      return Float32Array.from(out);
    };
  }

  // ---------- YIN pitch tracker, incremental ----------
  class PitchTracker {
    constructor() { this.buf = new Float32Array(0); this.frames = []; this.d = new Float32Array(TAU_MAX + 1); }
    push(x16) { // Float32Array at 16 kHz
      const nb = new Float32Array(this.buf.length + x16.length);
      nb.set(this.buf); nb.set(x16, this.buf.length);
      let off = 0;
      const need = WIN + TAU_MAX;
      while (off + need <= nb.length) { this.frames.push(this._frame(nb, off)); off += HOP; }
      this.buf = nb.slice(off);
    }
    _frame(x, o) {
      let e = 0; for (let j = 0; j < WIN; j++) e += x[o + j] * x[o + j];
      const rms = Math.sqrt(e / WIN);
      const d = this.d; d[0] = 1;
      let run = 0, best = -1, bestVal = 1e9;
      for (let tau = 1; tau <= TAU_MAX; tau++) {
        let s = 0;
        for (let j = 0; j < WIN; j++) { const v = x[o + j] - x[o + j + tau]; s += v * v; }
        run += s;
        d[tau] = run > 0 ? s * tau / run : 1;
      }
      // first dip below threshold
      for (let tau = TAU_MIN; tau <= TAU_MAX; tau++) {
        if (d[tau] < 0.15) {
          while (tau + 1 <= TAU_MAX && d[tau + 1] < d[tau]) tau++;
          best = tau; bestVal = d[tau]; break;
        }
      }
      if (best < 0) { for (let tau = TAU_MIN; tau <= TAU_MAX; tau++) if (d[tau] < bestVal) { bestVal = d[tau]; best = tau; } }
      let f0 = 0;
      if (bestVal < 0.35) {
        let t = best;
        if (best > TAU_MIN && best < TAU_MAX) {
          const a = d[best - 1], b = d[best], c = d[best + 1], den = a - 2 * b + c;
          if (den !== 0) t = best + 0.5 * (a - c) / den;
        }
        f0 = SR / t;
      }
      return { rms: rms, f0: f0, ap: bestVal };
    }
  }

  // ---------- helpers ----------
  const median = a => { if (!a.length) return NaN; const s = Float64Array.from(a).sort(); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const pct = (a, p) => { if (!a.length) return NaN; const s = Float64Array.from(a).sort(); const i = Math.min(s.length - 1, Math.max(0, Math.round(p * (s.length - 1)))); return s[i]; };
  const st = f => 12 * Math.log2(f / 55);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // frames -> features: dB energy (smoothed), voiced flag, semitone pitch (octave-corrected)
  function features(frames) {
    const n = frames.length;
    const rms = frames.map(f => f.rms);
    const noise = Math.max(pct(rms, 0.1), 1e-5);
    const peak = pct(rms, 0.98);
    const gate = Math.max(noise * 3, peak * 0.04);
    const voiced = new Uint8Array(n), pitch = new Float64Array(n).fill(NaN), E = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      E[i] = 20 * Math.log10(frames[i].rms + 1e-7);
      if (frames[i].f0 > 0 && frames[i].rms > gate && frames[i].ap < 0.3) { voiced[i] = 1; pitch[i] = st(frames[i].f0); }
    }
    // octave correction against a running median of voiced pitch
    const vp = []; for (let i = 0; i < n; i++) if (voiced[i]) vp.push(i);
    for (let k = 0; k < vp.length; k++) {
      const w = []; for (let j = Math.max(0, k - 7); j <= Math.min(vp.length - 1, k + 7); j++) w.push(pitch[vp[j]]);
      const m = median(w), i = vp[k];
      if (Math.abs(pitch[i] - m) > 8) pitch[i] -= 12 * Math.round((pitch[i] - m) / 12);
      if (Math.abs(pitch[i] - m) > 5) { voiced[i] = 0; pitch[i] = NaN; } // still wild: drop
    }
    // light median smoothing of pitch (3)
    const p2 = Float64Array.from(pitch);
    for (let i = 1; i < n - 1; i++) if (voiced[i - 1] && voiced[i] && voiced[i + 1]) p2[i] = median([pitch[i - 1], pitch[i], pitch[i + 1]]);
    // smoothed energy
    const Es = new Float64Array(n);
    for (let i = 0; i < n; i++) { let s = 0, c = 0; for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { s += E[j]; c++; } Es[i] = s / c; }
    // active region
    const actGate = 20 * Math.log10(gate + 1e-7);
    let a = 0, b = n - 1;
    while (a < n && Es[a] < actGate) a++;
    while (b > a && Es[b] < actGate) b--;
    const snr = 20 * Math.log10(peak / noise);
    return { n, voiced, pitch: p2, E: Es, start: a, end: b + 1, snr, actGate };
  }

  // drop silent runs (>= 0.25 s) inside [a,b): pauses between lines or words are not syllables.
  // Returns compressed features with idx (compressed -> original frame) and gap (frames removed after each frame).
  function compress(F, a, b, opt) {
    const minGap = (opt && opt.minGap) || 25, quiet = opt && opt.quiet;
    const sil = t => (!F.voiced[t] && F.E[t] < F.actGate + 4) || (quiet && quiet[t]);
    const keep = [], gap = [];
    let t = a;
    while (t < b) {
      if (sil(t)) {
        let u = t; while (u < b && sil(u)) u++;
        if (u - t >= minGap) { // remove, keeping 2 frames each side
          for (let j = t; j < Math.min(t + 2, u); j++) { keep.push(j); gap.push(0); }
          if (gap.length) gap[gap.length - 1] = (u - 2) - (t + 2);
          for (let j = Math.max(t + 2, u - 2); j < u; j++) { keep.push(j); gap.push(0); }
        } else for (let j = t; j < u; j++) { keep.push(j); gap.push(0); }
        t = u;
      } else { keep.push(t); gap.push(0); t++; }
    }
    const n = keep.length;
    const C = { n, idx: Int32Array.from(keep), gap: Int32Array.from(gap), voiced: new Uint8Array(n), pitch: new Float64Array(n), E: new Float64Array(n), actGate: F.actGate, snr: F.snr };
    for (let i = 0; i < n; i++) { C.voiced[i] = F.voiced[keep[i]]; C.pitch[i] = F.pitch[keep[i]]; C.E[i] = F.E[keep[i]]; }
    return C;
  }

  // count energy peaks (syllable nuclei estimate) in [a,b)
  function nucleiCount(F, a, b) {
    let c = 0, last = -100;
    for (let i = a + 2; i < b - 2; i++) {
      const v = F.E[i];
      if (v >= F.E[i - 1] && v > F.E[i + 1] && v >= F.E[i - 2] && v >= F.E[i + 2] && F.voiced[i]) {
        // prominence: min on each side within 25 frames
        let lm = v, rm = v;
        for (let j = i - 1; j >= Math.max(a, i - 150) && F.E[j] <= v; j--) lm = Math.min(lm, F.E[j]);
        for (let j = i + 1; j < Math.min(b, i + 150) && F.E[j] <= v; j++) rm = Math.min(rm, F.E[j]);
        if (v - Math.max(lm, rm) >= 2.5 && i - last >= 7) { c++; last = i; }
      }
    }
    return c;
  }

  // ---------- segmentation: N syllables with weights w over frames [a,b) ----------
  function segment(F, a, b, w, opt) {
    opt = opt || {};
    const T = b - a, N = w.length, W = w.reduce((x, y) => x + y, 0);
    const exp = w.map(x => T * x / W);
    // prefix sums for pitch variance
    const cs = new Float64Array(T + 1), cs2 = new Float64Array(T + 1), cn = new Float64Array(T + 1);
    for (let t = 0; t < T; t++) {
      const p = F.pitch[a + t], v = F.voiced[a + t] && !isNaN(p);
      cs[t + 1] = cs[t] + (v ? p : 0); cs2[t + 1] = cs2[t] + (v ? p * p : 0); cn[t + 1] = cn[t] + (v ? 1 : 0);
    }
    // boundary cost: dips in energy relative to local max, unvoiced bonus
    const bc = new Float64Array(T + 1);
    for (let t = 1; t < T; t++) {
      let mx = -1e9; for (let j = Math.max(0, t - 8); j <= Math.min(T - 1, t + 8); j++) mx = Math.max(mx, F.E[a + j]);
      bc[t] = (F.E[a + t] - mx) / 6 + (F.voiced[a + t] ? 0 : -0.6);
      if (F.gap && (F.gap[a + t - 1] > 0 || F.gap[a + t - 2] > 0 || F.gap[a + t] > 0)) bc[t] -= 3; // a pause is a natural boundary
    }
    const LD = opt.lambdaDur || 1.2, LP = opt.lambdaPitch || 0.08;
    const INF = 1e18;
    const D = new Float64Array((N + 1) * (T + 1)).fill(INF), BP = new Int32Array((N + 1) * (T + 1)).fill(-1);
    D[0] = 0;
    const band = opt.band || Infinity;
    let cumExp = 0;
    for (let k = 1; k <= N; k++) {
      const e = exp[k - 1];
      const minL = Math.max(2, Math.floor(e * 0.25)), maxL = Math.max(minL + 1, Math.ceil(e * 3.5 + 8));
      const prevCum = cumExp; cumExp += e;
      const lo = k === N ? T : Math.max(k * 2, Math.floor(cumExp - band)), hi = k === N ? T : Math.min(T - (N - k) * 2, Math.ceil(cumExp + band));
      for (let t = lo; t <= hi; t++) {
        const aMin = Math.max(t - maxL, 0), aMax = t - minL;
        let best = INF, arg = -1;
        for (let s = aMin; s <= aMax; s++) {
          const prev = D[(k - 1) * (T + 1) + s]; if (prev >= INF) continue;
          const L = t - s, r = Math.log(L / e);
          let c = prev + LD * r * r;
          const nv = cn[t] - cn[s];
          if (nv > 1) { const m = (cs[t] - cs[s]) / nv; c += LP * Math.min(9, (cs2[t] - cs2[s]) / nv - m * m); }
          else c += 0.8; // a syllable with no voiced frames is unlikely
          if (k < N) c += bc[t];
          if (c < best) { best = c; arg = s; }
        }
        D[k * (T + 1) + t] = best; BP[k * (T + 1) + t] = arg;
      }
    }
    if (D[N * (T + 1) + T] >= INF) return null;
    const bounds = new Array(N + 1); bounds[N] = T;
    for (let k = N; k >= 1; k--) bounds[k - 1] = BP[k * (T + 1) + bounds[k]];
    return bounds.map(x => x + a);
  }

  // line boundaries over candidate cut points (pauses and energy dips), DP on line lengths (matras)
  function segmentLines(F, lw, opt) {
    const LDL = (opt && opt.lambda) || 16, GB = (opt && opt.gapBonus) || 3;
    const n = F.n, N = lw.length, W = lw.reduce((x, y) => x + y, 0);
    const cand = new Set([0, n]);
    const bonus = new Map();
    for (let c = 0; c < n - 1; c++) if (F.gap[c] > 0) { cand.add(c + 1); bonus.set(c + 1, -GB * (0.5 + 0.5 * Math.min(1, F.gap[c] / 40))); }
    for (let c = 8; c < n - 8; c++) {
      let isMin = true; for (let j = c - 7; j <= c + 7; j++) if (F.E[j] < F.E[c]) { isMin = false; break; }
      let nearGap = false; for (let j = c - 4; j <= c + 4; j++) if (j >= 0 && j < n && F.gap[j] > 0) { nearGap = true; break; }
      if (isMin && !nearGap && !cand.has(c)) { let mx = -1e9; for (let j = c - 15; j <= c + 15; j++) if (j >= 0 && j < n) mx = Math.max(mx, F.E[j]); cand.add(c); bonus.set(c, Math.max(-1, (F.E[c] - mx) / 20)); }
    }
    const P = [...cand].sort((x, y) => x - y), K = P.length;
    const INF = 1e18, D = new Float64Array((N + 1) * K).fill(INF), BP = new Int32Array((N + 1) * K).fill(-1);
    D[0] = 0;
    let cum = 0;
    for (let k = 1; k <= N; k++) {
      const e = n * lw[k - 1] / W, minL = Math.max(4, 0.3 * e), maxL = 3 * e + 60;
      cum += e;
      for (let j = 1; j < K; j++) {
        if (k === N && j !== K - 1) continue;
        if (k < N && j === K - 1) continue;
        const b = P[j]; let best = INF, arg = -1;
        for (let i = j - 1; i >= 0; i--) {
          const L = b - P[i]; if (L < minL) continue; if (L > maxL) break;
          const prev = D[(k - 1) * K + i]; if (prev >= INF) continue;
          const r = Math.log(L / e);
          const c = prev + LDL * r * r + (k < N ? (bonus.get(b) || 0) : 0);
          if (c < best) { best = c; arg = i; }
        }
        D[k * K + j] = best; BP[k * K + j] = arg;
      }
    }

        report.mic = { mode: rec.mode, sampleRates: rec.rates, frames: frames.length, voiced: +(v / Math.max(1, F.n)).toFixed(2), snr: +F.snr.toFixed(1), medianSemitone: C.v.length ? +CE.median(C.v).toFixed(1) : null };
        $('#mres').innerHTML = `Mode ${rec.mode}, ${rec.sampleRate} Hz, voice heard ${(100 * report.mic.voiced).toFixed(0)}% of the time, signal/noise ${F.snr.toFixed(0)} dB. ${F.snr < 12 ? '<span class="bad">Too noisy.</span>' : '<span class="ok">Good.</span>'}`;
        show();
      }, 6000);
    } catch (e) { report.micError = e.name + ': ' + e.message; $('#mres').innerHTML = '<span class="bad">' + esc(report.micError) + '</span>'; show(); }
  };
  $('#st').onclick = () => { $('#sres').textContent = 'After a recording above, tap Play again and listen: is Amma as loud as before? Note it in the report.'; report.playAfterRecordAsked = true; player.play('u01', 1, true); setTimeout(() => player.stop(), 5000); show(); };
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText($('#report').value); } catch (e) { $('#report').select(); } };
  $('#share').onclick = async () => { try { await navigator.share({ text: $('#report').value }); } catch (e) {} };
  ready().then(show);
})();

</script></body></html>
